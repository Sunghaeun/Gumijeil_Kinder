<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>로그인 - 구미제일교회 유치부 반별명단</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <h1>구미제일교회 유치부</h1>
    <p class="login-sub">반별명단 관리 시스템 로그인</p>
    <div class="field"><label>이메일</label><input type="email" id="loginEmail" placeholder="담당 교사 이메일" autocomplete="username"></div>
    <div class="field"><label>비밀번호</label><input type="password" id="loginPassword" placeholder="비밀번호" autocomplete="current-password"></div>
    <div class="login-error" id="loginError"></div>
    <button class="btn-primary" id="btnLogin">로그인</button>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  // 이미 로그인되어 있으면 바로 앱 화면으로 이동
  if (isLoggedIn()) location.href = "index.html";

  async function doLogin() {
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    const errEl = document.getElementById("loginError");
    errEl.textContent = "";
    if (!email || !password) { errEl.textContent = "이메일과 비밀번호를 입력해주세요."; return; }

    try {
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });
      const body = await res.json();
      if (!res.ok) { errEl.textContent = body.error || "로그인에 실패했습니다."; return; }
      setSession(body);
      location.href = "index.html";
    } catch (e) {
      errEl.textContent = "서버에 연결할 수 없습니다. 잠시 후 다시 시도해주세요.";
    }
  }

  document.getElementById("btnLogin").addEventListener("click", doLogin);
  document.getElementById("loginPassword").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
</script>
</body>
</html>
